<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — command not found · Caleb Geiger</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0e0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e0a'/%3E%3Cpath d='M7 10l6 6-6 6' fill='none' stroke='%2339ff5a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='16' y='20' width='9' height='3' rx='1.5' fill='%2339ff5a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0e0a;
      --bg2: #0f1410;
      --bg3: #141b15;
      --border: #1e321e;
      --border-lit: #2a4529;
      --text: #d2ded2;
      --text-dim: #8fa28f;
      --text-faint: #788a78;
      --live: #39ff5a;
      --live-dim: #2ea84a;
      --ident: #ffb347;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid + scanlines, same treatment as the real hero */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
          transparent 0px, transparent 2px,
          rgba(0, 0, 0, 0.09) 2px, rgba(0, 0, 0, 0.09) 4px);
      pointer-events: none;
      z-index: 3;
    }

    ::selection {
      background: var(--live);
      color: var(--bg);
    }

    .term {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: rgba(9, 13, 9, 0.9);
      border: 1px solid var(--border-lit);
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    .bar {
      background: var(--bg3);
      padding: 0.55rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      border-bottom: 1px solid var(--border);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .r {
      background: #ff5f57;
    }

    .a {
      background: #febc2e;
    }

    .g {
      background: #28c840;
    }

    .title {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dim);
    }

    .out {
      padding: 1.4rem 1.3rem 1.6rem;
    }

    .out p {
      overflow-wrap: anywhere;
    }

    .ps1 {
      color: var(--live);
    }

    .err {
      color: #ff8b8b;
    }

    .muted {
      color: var(--text-faint);
    }

    .dim {
      color: var(--text-dim);
    }

    .code {
      color: var(--ident);
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin: 0.6rem 0 0.2rem;
    }

    .links {
      margin-top: 1.4rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.4rem;
    }

    .links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.2s;
    }

    .links a::before {
      content: '→ ';
      color: var(--live-dim);
    }

    .links a:hover,
    .links a:focus-visible {
      color: var(--live);
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--live);
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    :focus-visible {
      outline: 2px solid var(--live);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="term">
    <div class="bar" aria-hidden="true">
      <span class="dot r"></span><span class="dot a"></span><span class="dot g"></span>
      <span class="title">caleb@portfolio: ~</span>
    </div>

    <div class="out">
      <p><span class="ps1" aria-hidden="true">$</span> <span id="attempt">open /</span></p>
      <p class="err">command not found</p>

      <h1 class="code">404</h1>
      <p class="dim">That page doesn't exist — or it did once and doesn't anymore.</p>

      <p class="muted" style="margin-top:1rem">Everything lives on one page. Try:</p>

      <nav class="links">
        <a href="/">home</a>
        <a href="/#about">about</a>
        <a href="/#skills">skills</a>
        <a href="/#experience">experience</a>
        <a href="/#projects">projects</a>
        <a href="/#contact">contact</a>
      </nav>

      <p style="margin-top:1.2rem"><span class="ps1" aria-hidden="true">$</span> <span class="cursor"
          aria-hidden="true"></span></p>
    </div>
  </main>

  <script>
    /* Echo back what they actually asked for. textContent, so a crafted
       URL can only ever render as inert text. */
    (function () {
      var p = (location.pathname + location.search).slice(0, 80) || '/';
      document.getElementById('attempt').textContent = 'open ' + p;
      document.title = '404 — ' + p + ' · Caleb Geiger';
    })();
  </script>
</body>

</html>
